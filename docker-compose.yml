version: '3.8'

services:
  analytics-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_predictive_analytics_engine
    ports:
      - "8501:8501"
    environment:
      - APP_ENV=production
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
